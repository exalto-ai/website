app = "exalto-prod-landing"
primary_region = "sjc"

[build]
  dockerfile = "deploy/Dockerfile"

  [build.args]
    EXALTO_PRODUCT_ORIGIN = "https://seal.exalto.ai"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
