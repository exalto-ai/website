name: Deploy website

# The landing site is a standalone static build with no runtime dependency on
# the API, so it deploys on its own cadence rather than through the gated
# three-service promotion in deploy.yml. A marketing copy change must not wait
# on an API promotion, and an API rollback must not revert the public site.

on:
  workflow_dispatch:

permissions:
  contents: read

# Landing rollouts serialize against each other but never against the product
# rollout in deploy.yml, which holds the `fly-production` group.
concurrency:
  group: fly-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy exalto.ai
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      FLY_APP: exalto-prod-landing
    steps:
      - uses: actions/checkout@v6

      # superfly/flyctl-actions 1.6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Resolve the image label
        run: |
          set -euo pipefail
          label="prod-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "IMAGE_LABEL=$label"
            echo "LANDING_IMAGE_TAG=registry.fly.io/${FLY_APP}:$label"
          } >> "$GITHUB_ENV"

      # Build before touching any Machine so a build failure — including a
      # check:copy violation, which runs inside the image build — is a no-op in
      # production.
      - name: Build landing image on Fly
        id: landing-image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LANDING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy . --remote-only --build-only --push \
            --image-label "$IMAGE_LABEL" \
            --config "$GITHUB_WORKSPACE/fly.toml"
          flyctl auth docker
          digest="$(bash deploy/resolve-image-digest.sh "$LANDING_IMAGE_TAG")"
          echo "ref=${LANDING_IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"

      # The first rollout onto a freshly created app has no Machines yet, so an
      # absent current image is recorded as empty rather than failing the run.
      - name: Record the rollback image
        id: previous
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LANDING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          machines="$(flyctl machines list --json --app "$FLY_APP")"
          image="$(jq -r '
            [
              .[]?.image_ref |
              "\(.registry)/\(.repository)@\(.digest)"
            ] | unique |
            if length == 0 then ""
            elif length == 1 then .[0]
            else error("expected at most one current image for the app")
            end
          ' <<<"$machines")"
          if test -n "$image" && ! [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "current image is not digest-pinned: $image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy landing image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LANDING_DEPLOY_TOKEN }}
          LANDING_IMAGE: ${{ steps.landing-image.outputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$LANDING_IMAGE" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "target image is not digest-pinned: $LANDING_IMAGE" >&2
            exit 1
          fi
          touch "$RUNNER_TEMP/landing-rollout-attempted"
          flyctl deploy . --image "$LANDING_IMAGE" \
            --ha=false --strategy rolling \
            --config "$GITHUB_WORKSPACE/fly.toml"

      # Serve checks run against the Fly hostname so the rollout is verified
      # before exalto.ai DNS exists, and keeps working after it does.
      - name: Verify the landing site serves
        run: |
          set -euo pipefail
          origin="https://${FLY_APP}.fly.dev"
          body="$(curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            --max-time 20 "$origin/")"
          grep -q '<title' <<<"$body"
          # Old docs URLs must redirect, not fall back to the landing page.
          # Do not couple this rollout to the product site's availability.
          for path in /docs/ '/docs/getting-started/?section=connect-an-sdk'; do
            redirect="$(curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 \
              --output /dev/null --write-out '%{http_code} %{redirect_url}' \
              "$origin$path")"
            test "$redirect" = "308 https://seal.exalto.ai$path"
          done

      - name: Summarize the rollout
        env:
          LANDING_IMAGE: ${{ steps.landing-image.outputs.ref }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          {
            echo "## Landing rollout"
            echo
            echo "- Source: $GITHUB_SHA"
            echo "- Image: $LANDING_IMAGE"
            echo "- Previous: ${PREVIOUS_IMAGE:-none (first rollout)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the previous image after a failed rollout
        if: ${{ failure() && steps.previous.outcome == 'success' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LANDING_DEPLOY_TOKEN }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          set -euo pipefail
          if test ! -e "$RUNNER_TEMP/landing-rollout-attempted"; then
            echo "no Machine was changed; nothing to restore"
            exit 0
          fi
          if test -z "$PREVIOUS_IMAGE"; then
            echo "the first rollout has no previous image to restore" >&2
            exit 1
          fi
          flyctl deploy . --image "$PREVIOUS_IMAGE" \
            --ha=false --strategy rolling \
            --config "$GITHUB_WORKSPACE/fly.toml"
