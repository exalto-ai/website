name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify legacy documentation redirects
        run: npm run test:redirects
      - name: Verify deploy target
        run: |
          set -euo pipefail
          configured="$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)"
          declared="$(sed -n 's/^      FLY_APP: \(.*\)$/\1/p' .github/workflows/deploy.yml)"
          test -n "$configured"
          test "$configured" = "$declared"
